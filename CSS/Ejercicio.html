<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ejercicio CSS y Flexbox</title>

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="ejercicio.css">

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header role="banner">
        <nav class="navbar" aria-label="Navegación principal">
            <div class="logo" aria-label="Logotipo">
                <i class="fas fa-code" aria-hidden="true"></i>
                <span>Logo</span>
            </div>

            <ul class="nav-links" role="list">
                <li><a href="#" aria-current="page">Inicio</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>

            <div class="user-icon" aria-label="Perfil de usuario">
                <i class="fas fa-user-circle" aria-hidden="true"></i>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL: PERFIL -->
    <main id="main-content" class="card-container">
        <article class="profile-card" aria-labelledby="profile-name">

            <img class="avatar" src="https://randomuser.me/api/portraits/lego/5.jpg" alt="Foto de perfil de Ana García">

            <h2 id="profile-name">Ana García</h2>
            <p class="subtitle">Desarrolladora Frontend</p>

            <div class="button-group">
                <button class="btn primary" aria-label="Seguir a Ana García">
                    <i class="fas fa-user-plus" aria-hidden="true"></i> Seguir
                </button>
                <button class="btn secondary" aria-label="Enviar mensaje a Ana García">
                    <i class="fas fa-envelope" aria-hidden="true"></i> Mensaje
                </button>
            </div>

            <div class="stats" aria-label="Estadísticas del perfil">
                <div class="stat-item">
                    <strong>120</strong>
                    <span>Seguidores</span>
                </div>
                <div class="stat-item">
                    <strong>85</strong>
                    <span>Siguiendo</span>
                </div>
                <div class="stat-item stat-highlight">
                    <strong>32</strong>
                    <span>Publicaciones</span>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>Ejercicio de Flexbox · Etiquetas semánticas y accesibles</p>
    </footer>

</body>

</html>
